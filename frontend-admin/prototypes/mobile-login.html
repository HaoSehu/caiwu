<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>管理端移动端原型 - 登录页</title>
<style>
:root {
  --color-primary: #0052d9; --color-primary-hover: #0041b3; --color-primary-soft: #edf4ff;
  --color-primary-border: #bfd4ff;
  --bg-color: #f5f7fa; --bg-card: #ffffff; --bg-soft: #fafbfd;
  --text-primary: #1d2129; --text-secondary: #4e5969; --text-placeholder: #86909c; --text-inverse: #ffffff;
  --border-color: #e5e6eb; --divider-color: #ebedf0;
  --radius-sm: 6px; --radius-md: 8px; --radius-lg: 12px;
  --shadow-sm: 0 1px 2px rgba(29,33,41,0.05), 0 1px 3px rgba(29,33,41,0.04);
  --shadow-xl: 0 20px 48px rgba(29,33,41,0.14);
  --font-main: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font-main); font-size: 14px; line-height: 1.5; color: var(--text-primary); background: var(--bg-color); -webkit-font-smoothing: antialiased; }

.login-page {
  position: relative; display: flex; align-items: center; justify-content: center;
  min-height: 100vh; overflow: hidden;
}

/* Background decoration */
.login-decor {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(circle at 10% 20%, rgba(0,82,217,0.08), transparent 42%),
    radial-gradient(circle at 90% 85%, rgba(0,82,217,0.06), transparent 50%),
    linear-gradient(180deg, var(--bg-color) 0%, var(--bg-soft) 100%);
}

.login-center {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center;
  width: 100%; padding: 32px 20px;
}

/* Brand */
.login-brand { margin-bottom: 28px; text-align: center; }
.login-brand-name {
  font-size: 28px; font-weight: 600; color: var(--text-primary);
  letter-spacing: -0.5px; line-height: 1.3;
}
.login-brand-sub {
  margin-top: 8px; font-size: 14px; color: var(--text-secondary); line-height: 1.6;
}

/* Card */
.login-card {
  width: 100%; max-width: 420px;
  padding: 32px;
  background: var(--bg-card);
  border: 1px solid var(--divider-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
}

.login-card-head strong {
  display: block; font-size: 20px; font-weight: 600;
  color: var(--text-primary); letter-spacing: -0.2px;
}
.login-card-head p {
  margin-top: 6px; font-size: 14px; color: var(--text-secondary); line-height: 1.6;
}

/* Form */
.login-form { margin-top: 24px; }
.form-item { margin-bottom: 18px; }
.form-label {
  display: block; margin-bottom: 6px;
  font-size: 13px; font-weight: 500; color: var(--text-primary);
}
.input-wrap input {
  width: 100%; height: 40px; padding: 0 14px;
  border: 1px solid var(--border-color); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; color: var(--text-primary);
  background: var(--bg-card); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input-wrap input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(0,82,217,0.12);
}
.input-wrap input::placeholder { color: var(--text-placeholder); }

/* Options row */
.login-options {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 22px; font-size: 13px;
}
.remember-check {
  display: flex; align-items: center; gap: 6px;
  color: var(--text-secondary); cursor: pointer;
}
.remember-check input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: var(--color-primary); cursor: pointer;
}
.forgot-link {
  color: var(--color-primary); font-size: 13px; text-decoration: none;
  transition: color 0.15s;
}
.forgot-link:hover { color: var(--color-primary-hover); }

/* Submit button */
.login-submit {
  width: 100%; height: 44px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: var(--radius-sm);
  background: var(--color-primary); color: var(--text-inverse);
  font-size: 15px; font-weight: 500; font-family: inherit;
  cursor: pointer; letter-spacing: 0.3px;
  box-shadow: 0 2px 8px rgba(0,82,217,0.28);
  transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
}
.login-submit:hover { background: var(--color-primary-hover); box-shadow: 0 4px 12px rgba(0,82,217,0.32); }
.login-submit:active { transform: scale(0.98); }
.login-submit:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

/* Footer */
.login-footer {
  margin-top: 20px; text-align: center;
  font-size: 12px; color: var(--text-placeholder);
}

/* ========== Responsive ========== */
@media (min-width: 641px) {
  .login-center { padding: 48px 24px; }
  .login-brand-name { font-size: 32px; }
}

@media (max-width: 380px) {
  .login-card { padding: 24px 20px; }
  .login-brand-name { font-size: 24px; }
}
</style>
</head>
<body>

<div class="login-page">
  <div class="login-decor"></div>

  <div class="login-center">
    <!-- Brand -->
    <div class="login-brand">
      <div class="login-brand-name">CloudPanel</div>
      <p class="login-brand-sub">服务器管理与计费平台</p>
    </div>

    <!-- Card -->
    <div class="login-card">
      <div class="login-card-head">
        <strong>管理员登录</strong>
        <p>请输入您的管理员账号和密码</p>
      </div>

      <form class="login-form" onsubmit="return false">
        <div class="form-item">
          <label class="form-label">用户名</label>
          <div class="input-wrap">
            <input type="text" placeholder="请输入用户名" autocomplete="username">
          </div>
        </div>

        <div class="form-item">
          <label class="form-label">密码</label>
          <div class="input-wrap">
            <input type="password" placeholder="请输入密码" autocomplete="current-password">
          </div>
        </div>

        <div class="login-options">
          <label class="remember-check">
            <input type="checkbox" checked> 记住登录
          </label>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="login-submit">
          登录
        </button>
      </form>

      <div class="login-footer">
        <p>登录即表示您同意服务条款和隐私政策</p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
