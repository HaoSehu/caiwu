<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP 放在 head 最前，确保后续资源请求都受约束。meta 方式不支持 frame-ancestors/report-uri/sandbox，
         点击劫持防护仍需在 nginx 加 X-Frame-Options 与响应头 CSP（见 docs/参考资料/运维/前端Nginx伪静态配置.md）。
         script-src 允 https://static.geetest.com：极验 gt4.js 的默认地址（src/composables/useGeeTestCaptcha.ts:39），
         后端也会下发同源 /api/v2/client/auth/captcha-script 代理地址（backend/app/Services/Auth/GeeTestService.php:26）。
         script-src 允 https://tdesign.gtimg.com：TDesign Icon 组件默认 loadDefaultIcons=true 会动态插入
         https://tdesign.gtimg.com/icon/0.4.5/fonts/index.js 的 SVG 雪碧图（Header/MenuContent 等处用到 t-icon）。
         frame-src 允 alipays:：移动端充值用隐藏 iframe 拉起支付宝 App（src/domains/finance/useRecharge.ts:407-427）。
         style-src 必须含 'unsafe-inline'（TDesign 运行时注入样式）；font-src 含 data:（TencentSansW7 base64 @font-face）。
         img-src/connect-src 用 https: 兜底：API 源站与支付宝二维码代理地址由 VITE_API_BASE_URL 配置，无法在静态 HTML 写死。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://static.geetest.com https://tdesign.gtimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self' https: blob:; frame-src 'self' https: alipays:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- 单图 32×32：浏览器标签页的最大渲染尺寸就是 32px，
         原先是 64×64 单图未压缩 32bpp（16958 B），缩到 32×32 后 4286 B，首访省 12.6 KB（PB-21） -->
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico" />
    <!-- PB-20：极验脚本域名在 main.ts 里由 initClientRuntimeConnectionHints 预热，
         但那段代码要等 JS 下载+解析完才执行，登录页因此白等一个 RTT。
         静态 dns-prefetch 在 HTML 解析阶段就发出，代价只有一次 DNS 查询。
         不用 preconnect：绝大多数访客不进登录页，提前建 TCP/TLS 会白占连接。 -->
    <link rel="dns-prefetch" href="//static.geetest.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <title>创欧云用户控制台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
