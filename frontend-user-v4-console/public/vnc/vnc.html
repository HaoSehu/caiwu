<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VNC 控制台</title>
  <style>
    :root {
      --bar-bg: rgb(110, 132, 163);
      --bar-dark: rgb(83, 99, 122);
      --bar-darker: rgb(60, 75, 95);
      --container-bg: #313131;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      /* 软键盘高度，由 visualViewport 同步（默认 0） */
      --kb-height: 0px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--container-bg);
      font-family: sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      /* 手机端禁用长按选中/呼出系统菜单：远程桌面里长按应是右键，而不是弹出「复制/翻译」 */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ---- 主容器 ---- */
    #noVNC_container {
      width: 100%;
      height: 100%;
      /* dvh 随移动端地址栏与软键盘动态收缩，避免画面被裁掉底部 */
      height: 100dvh;
      background: var(--container-bg);
      position: relative;
      touch-action: none;
    }
    #noVNC_container canvas {
      display: block;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 软键盘输入代理：承载系统输入法，本身必须留在视口内且不可见。
       不能用 display:none / visibility:hidden，否则移动端不会唤起软键盘。
       opacity 不用 0：部分 Android 输入法把完全透明的元素判定为不可见而拒绝弹键盘。 */
    #noVNC_kbd_proxy {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 1px;
      height: 1px;
      padding: 0;
      border: 0;
      outline: none;
      opacity: 0.01;
      z-index: 1;
      resize: none;
      font-size: 16px; /* 小于 16px 时 iOS Safari 会自动放大页面 */
      -webkit-user-select: text;
      user-select: text;
    }

    /* ---- 状态条（顶部滑入） ---- */
    #noVNC_status {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      padding: calc(6px + var(--safe-top)) calc(12px + var(--safe-right)) 6px calc(12px + var(--safe-left));
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #fff;
      transform: translateY(-100%);
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0;
      cursor: pointer;
    }
    #noVNC_status.open {
      transform: translateY(0);
      opacity: 1;
    }
    #noVNC_status.normal  { background: rgba(92, 92, 92, 0.92); }
    #noVNC_status.error   { background: rgba(200, 55, 55, 0.92); }
    #noVNC_status.warn    { background: rgba(160, 140, 20, 0.92); }

    /* ---- 控制栏锚点（左侧垂直居中） ---- */
    #noVNC_control_bar_anchor {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    /* ---- 控制栏主体 ---- */
    #noVNC_control_bar {
      position: relative;
      left: calc(-100% - var(--safe-left));
      transition: left 0.4s ease, box-shadow 0.4s ease;
      background: var(--bar-bg);
      border-radius: 0 12px 12px 0;
      padding: 10px 8px;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
    }
    #noVNC_control_bar.open {
      left: 0;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.5);
    }

    /* ---- 拉手 ---- */
    #noVNC_control_bar_handle {
      position: absolute;
      right: -28px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 52px;
      background: var(--bar-dark);
      border-radius: 0 6px 6px 0;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #noVNC_control_bar_handle::after {
      content: '';
      display: block;
      width: 6px;
      height: 10px;
      border-left: 2px solid #fff;
      border-right: 2px solid #fff;
      transition: transform 0.4s ease;
    }
    #noVNC_control_bar.open #noVNC_control_bar_handle::after {
      transform: scaleX(-1);
    }

    /* ---- 控制栏内容 ---- */
    .noVNC_scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    /* logo */
    .noVNC_logo {
      font-size: 13px;
      font-weight: bold;
      color: #ff0;
      text-shadow: 0.1em 0.1em 0 #000;
      line-height: 0.9;
      text-align: center;
      padding: 4px 0;
    }
    .noVNC_logo span { color: #080; }

    .noVNC_scroll hr {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.2);
      width: 100%;
      margin: 4px 0;
    }

    /* 图标按钮 */
    .noVNC_button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      transition: background 0.15s;
      padding: 0;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .noVNC_button:hover  { background: rgba(255,255,255,0.15); }
    .noVNC_button:active { background: rgba(0,0,0,0.3); }
    .noVNC_button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .noVNC_button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---- 面板（弹出） ---- */
    .panel_wrap {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      align-items: center;
      pointer-events: none;
      z-index: 20;
    }
    .noVNC_panel {
      pointer-events: auto;
      transform: translateX(60px);
      /* visibility 用 0s + 0.4s 延迟：关闭时等动画结束再隐藏，
         打开时立即变为 visible，否则按钮点击后的同步 focus() 会因元素仍 hidden 而失败，
         移动端也就无法在同一次用户手势里唤起软键盘。 */
      transition: transform 0.4s ease, opacity 0.4s ease, visibility 0s linear 0.4s;
      visibility: hidden;
      opacity: 0;
      background: #fff;
      color: #111;
      border-radius: 12px;
      border: 2px solid #ddd;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.5);
      padding: 16px;
      min-width: 220px;
      max-width: calc(100vw - 120px);
      max-height: calc(100vh - 40px - var(--safe-top) - var(--safe-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .noVNC_panel.open {
      transform: translateX(70px);
      visibility: visible;
      opacity: 1;
      transition: transform 0.4s ease, opacity 0.4s ease, visibility 0s;
    }
    .panel_heading {
      background: var(--bar-bg);
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 12px;
    }
    .noVNC_panel textarea {
      width: 300px;
      height: 140px;
      resize: both;
      font-family: monospace;
      font-size: 16px; /* 避免 iOS 聚焦输入框时自动放大页面 */
    }
    /* 剪贴板显式发送：不能只依赖 textarea 的 change（失焦才触发），
       移动端键盘弹出时用户很难通过“点别处”产生一次可靠的 change。 */
    .noVNC_panel_actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .noVNC_panel_actions button {
      flex: 1;
      padding: 8px 14px;
      border: 1px solid var(--bar-bg);
      border-radius: 6px;
      background: var(--bar-bg);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .noVNC_panel_actions button:active { background: var(--bar-dark); }
    .noVNC_panel_actions button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    /* html,body 的 user-select:none 会继承到表单控件，iOS Safari 上长按选择/粘贴菜单会失效；
       剪贴板面板与错误详情需要可选中，这里显式回补 */
    #clipboard_text,
    #noVNC_error_message {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* ---- 伪全屏（iPhone Safari 无 Fullscreen API 时的降级） ---- */
    body.novnc-pseudo-fullscreen #noVNC_container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
    body.novnc-pseudo-fullscreen #noVNC_control_bar_anchor {
      z-index: 30;
    }

    /* ---- 过渡遮罩（连接中） ---- */
    #noVNC_transition {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,0.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3em;
      gap: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
    }
    #noVNC_transition.show {
      opacity: 1;
      visibility: visible;
    }
    .noVNC_spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- 错误遮罩 ---- */
    #noVNC_error {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(16px + var(--safe-top)) calc(16px + var(--safe-right))
               calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
    }
    #noVNC_error.show { opacity: 1; visibility: visible; }
    #noVNC_error_box {
      background: #fff;
      border-radius: 12px;
      padding: 28px 32px;
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-shadow: 6px 6px 0 rgba(0,0,0,0.4);
    }
    #noVNC_error_icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #dc2626;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
    }
    #noVNC_error_title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    #noVNC_error_message { font-size: 13px; color: #555; line-height: 1.7; margin-bottom: 16px; word-break: break-word; }
    #noVNC_error button {
      padding: 7px 22px;
      border: 1px solid #aaa;
      border-radius: 6px;
      background: #f1f5f9;
      cursor: pointer;
      font-size: 13px;
    }
    #noVNC_error button:hover { background: #e2e8f0; }

    /* ------------------------------------------------------------------
       移动端自适应
       竖屏 / 触屏窄屏：控制栏由「左侧竖条」改为「底部横条」，
       避免遮挡远程桌面，并留出软键盘与安全区空间。
       ------------------------------------------------------------------ */
    @media (max-width: 767px), (max-height: 500px) and (pointer: coarse) {
      #noVNC_status {
        padding: calc(8px + var(--safe-top)) calc(10px + var(--safe-right)) 8px calc(10px + var(--safe-left));
        font-size: 13px;
      }

      /* 锚点横跨整个底部，控制栏由左侧滑入改为底部滑入；
         --kb-height 由 visualViewport 同步，软键盘弹出时整条控制栏上移到键盘之上 */
      #noVNC_control_bar_anchor {
        top: auto;
        bottom: var(--kb-height, 0px);
        left: 0;
        width: 100%;
        height: auto;
        align-items: flex-end;
        justify-content: center;
        transition: bottom 0.2s ease;
      }

      #noVNC_control_bar {
        left: 0;
        top: auto;
        width: 100%;
        padding: 6px calc(8px + var(--safe-left)) calc(6px + var(--safe-bottom)) calc(8px + var(--safe-right));
        border-radius: 12px 12px 0 0;
        transition: top 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
        /* 只下移自身高度：拉手位于 top:-24px，会留在视口底部露出 24px 可点区域。
           若再叠加 24px，拉手会整块落到视口外，手机端将完全无法展开控制栏。 */
        transform: translateY(100%);
      }
      #noVNC_control_bar.open {
        left: 0;
        transform: translateY(0);
        box-shadow: 0 -6px 0 rgba(0,0,0,0.5);
      }

      /* 拉手贴控制栏上沿、水平居中 */
      #noVNC_control_bar_handle {
        right: auto;
        left: 50%;
        top: -24px;
        transform: translateX(-50%);
        width: 56px;
        height: 24px;
        border-radius: 8px 8px 0 0;
        box-shadow: 0 -3px 0 rgba(0,0,0,0.5);
      }
      #noVNC_control_bar_handle::after {
        width: 10px;
        height: 6px;
        border-left: none;
        border-right: none;
        border-top: 2px solid #fff;
        border-bottom: 2px solid #fff;
      }
      #noVNC_control_bar.open #noVNC_control_bar_handle::after {
        transform: scaleY(-1);
      }

      /* 按钮横向排列并允许换行 */
      .noVNC_scroll {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .noVNC_scroll hr {
        width: 1px;
        height: 26px;
        margin: 0 2px;
        border-top: none;
        border-left: 1px solid rgba(255,255,255,0.2);
      }
      .noVNC_logo { display: none; }

      /* 触屏下加大点击面积 */
      .noVNC_button {
        width: 46px;
        height: 46px;
        min-width: 46px;
        min-height: 46px;
      }
      .noVNC_button svg {
        width: 22px;
        height: 22px;
      }

      /* 面板从底部弹出，宽度铺满；同样让开软键盘高度，否则输入框会被键盘盖住 */
      .panel_wrap {
        top: auto;
        bottom: var(--kb-height, 0px);
        left: 0;
        width: 100%;
        height: auto;
        align-items: flex-end;
        justify-content: center;
        transition: bottom 0.2s ease;
      }
      .noVNC_panel,
      .noVNC_panel.open {
        transform: translateY(100%);
      }
      .noVNC_panel.open {
        transform: translateY(calc(-1 * (var(--safe-bottom) + 72px)));
      }
      .noVNC_panel {
        min-width: 0;
        width: calc(100vw - 16px);
        max-width: calc(100vw - 16px);
        padding: 14px;
        border-radius: 12px;
        margin-bottom: 0;
      }
      .noVNC_panel textarea {
        width: 100%;
        min-height: 110px;
      }

      #noVNC_error_box {
        width: 100%;
        padding: 24px 20px;
      }
    }

    /* 超小屏：进一步压缩间距，保证一排按钮不折行 */
    @media (max-width: 380px) {
      .noVNC_button {
        width: 42px;
        height: 42px;
        min-width: 42px;
        min-height: 42px;
      }
      .noVNC_button svg {
        width: 20px;
        height: 20px;
      }
      .noVNC_scroll { gap: 5px; }
    }

    /* 横屏小高度：底部控制栏不再让出竖向空间，改为半透明紧凑排 */
    @media (orientation: landscape) and (max-height: 480px) {
      #noVNC_control_bar {
        flex-direction: row;
      }
      .noVNC_scroll {
        flex-wrap: nowrap;
      }
      .noVNC_button {
        width: 40px;
        height: 40px;
        min-width: 40px;
        min-height: 40px;
      }
    }
  </style>
</head>
<body>

<!-- 主画面 -->
<div id="noVNC_container"></div>

<!-- 顶部状态条 -->
<div id="noVNC_status" title="点击关闭"></div>

<!-- 控制栏锚点 -->
<div id="noVNC_control_bar_anchor">
  <div id="noVNC_control_bar">
    <div id="noVNC_control_bar_handle" role="button" tabindex="0" title="展开/收起控制栏" aria-label="展开或收起控制栏" aria-expanded="false"></div>
    <div class="noVNC_scroll">

      <!-- Logo -->
      <div class="noVNC_logo"><span>no</span><br>VNC</div>
      <hr>

      <!-- Ctrl+Alt+Del -->
      <button class="noVNC_button" id="btn_cad" title="发送 Ctrl+Alt+Del" disabled>
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="5" height="12" rx="1"/><rect x="9" y="6" width="5" height="12" rx="1"/><rect x="16" y="6" width="6" height="12" rx="1"/></svg>
      </button>

      <!-- 键盘（移动端唤起系统软键盘，桌面端聚焦远程桌面接收物理键盘） -->
      <button class="noVNC_button" id="btn_keyboard" title="键盘" aria-label="键盘">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      </button>

      <!-- 剪贴板 -->
      <button class="noVNC_button" id="btn_clipboard" title="剪贴板">
        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M7 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><path d="M9 12h6M9 16h4"/></svg>
      </button>

      <!-- 全屏 -->
      <button class="noVNC_button" id="btn_fullscreen" title="全屏">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <hr>

      <!-- 断开 -->
      <button class="noVNC_button" id="btn_disconnect" title="断开连接" disabled>
        <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
      </button>

    </div>
  </div>
</div>

<!-- 剪贴板面板 -->
<div class="panel_wrap" id="wrap_clipboard">
  <div class="noVNC_panel" id="panel_clipboard">
    <div class="panel_heading">剪贴板</div>
    <textarea id="clipboard_text" placeholder="在此编辑剪贴板内容..."></textarea>
    <div class="noVNC_panel_actions">
      <button type="button" id="btn_clipboard_send">发送到远程</button>
    </div>
  </div>
</div>

<!-- 连接中遮罩 -->
<div id="noVNC_transition">
  <div class="noVNC_spinner"></div>
  <div id="noVNC_transition_text">正在连接远程桌面...</div>
</div>

<!-- 错误遮罩 -->
<div id="noVNC_error">
  <div id="noVNC_error_box">
    <div id="noVNC_error_icon">✕</div>
    <div id="noVNC_error_title">VNC 连接失败</div>
    <div id="noVNC_error_message">未知错误</div>
    <button id="btn_retry">重新尝试</button>
  </div>
</div>

<!-- 软键盘输入代理 -->
<textarea id="noVNC_kbd_proxy" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>

<script type="module">
  import RFB from './core/rfb.js'

  // ---- DOM ----
  const container      = document.getElementById('noVNC_container')
  const statusEl       = document.getElementById('noVNC_status')
  const transEl        = document.getElementById('noVNC_transition')
  const transText      = document.getElementById('noVNC_transition_text')
  const errorEl        = document.getElementById('noVNC_error')
  const errorMsgEl     = document.getElementById('noVNC_error_message')
  const controlBar     = document.getElementById('noVNC_control_bar')
  const barHandle      = document.getElementById('noVNC_control_bar_handle')
  const btnKeyboard    = document.getElementById('btn_keyboard')
  const keyboardProxy  = document.getElementById('noVNC_kbd_proxy')
  const btnCad         = document.getElementById('btn_cad')
  const btnClipboard   = document.getElementById('btn_clipboard')
  const btnFullscreen  = document.getElementById('btn_fullscreen')
  const btnDisconnect  = document.getElementById('btn_disconnect')
  const btnRetry       = document.getElementById('btn_retry')
  const panelClipboard = document.getElementById('panel_clipboard')
  const clipboardText  = document.getElementById('clipboard_text')
  const btnClipboardSend = document.getElementById('btn_clipboard_send')

  let rfb = null
  let rfbConnected = false
  let statusTimer = null
  /** 最近一次已发送到远端的剪贴板内容：change 与显式发送按钮会连着触发，
      只靠事件去重不够，必须按内容判重，避免同一次编辑被发两遍。 */
  let lastSentClipboard = null

  /** 三个远程控制能力（Ctrl+Alt+Del / 键盘 / 剪贴板）都依赖已建立的 RFB 会话；
      未连接时必须显式提示，否则按钮看起来点了没反应。 */
  function requireRemoteReady() {
    if (rfb && rfbConnected) return true
    showStatus('远程桌面尚未连接，请先重新连接', 'warn', 2500)
    return false
  }

  // 被父页面以 iframe 嵌入时，把真实连接状态回传，供外层展示「连接中/已连接/已断开/失败」。
  // 独立窗口打开时 window.parent === window，不上报。
  // targetOrigin 取父页面通过 parent_origin 参数显式传来的值：控制台可能经别名域/预览域访问，
  // 与 CLIENT_CONSOLE_URL 不一致时用 location.origin 会让浏览器静默丢弃消息。
  // 非法值（非 http/https）一律回退同源；父页面侧另有 source + origin 双重校验。
  function resolveParentOrigin() {
    const raw = String(new URLSearchParams(location.search).get('parent_origin') || '').trim()
    if (/^https?:\/\/[^/]+$/i.test(raw)) return raw
    return location.origin
  }

  function notifyParent(status, message = '') {
    if (window.parent === window) return
    try {
      window.parent.postMessage({ source: 'caiwu-vnc', status, message }, resolveParentOrigin())
    } catch {}
  }

  // ---- 移动端软键盘支持 ----
  const isTouchDevice = (() => {
    try {
      return window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window
    } catch {
      return 'ontouchstart' in window
    }
  })()

  // 桌面端点击「键盘」等同于聚焦远程桌面，物理键盘由 noVNC 直接接管。
  function focusDesktop() {
    try {
      rfb?.focus?.()
      return
    } catch {}
    container.querySelector('canvas')?.focus?.()
  }

  // 移动端没有物理键盘，必须借助一个真实可聚焦的输入框唤起系统软键盘。
  // 代理框始终处于清空状态，只负责捕获输入法提交的字符并转发到远程桌面。
  function openSoftKeyboard() {
    keyboardProxy.value = ''
    keyboardProxy.focus({ preventScroll: true })
  }

  function closeSoftKeyboard() {
    keyboardProxy.blur()
    focusDesktop()
  }

  btnKeyboard.addEventListener('click', (e) => {
    e.stopPropagation()
    if (!requireRemoteReady()) return
    if (!isTouchDevice) {
      focusDesktop()
      return
    }
    if (document.activeElement === keyboardProxy) {
      closeSoftKeyboard()
    } else {
      openSoftKeyboard()
    }
  })

  keyboardProxy.addEventListener('input', (e) => {
    // 输入法组合中的中间态（拼音字母、候选词）不能当最终文本发到远端，
    // 否则远端会先收到一串无意义字符；最终文本由 compositionend 提交。
    if (e.isComposing) return

    const text = keyboardProxy.value
    keyboardProxy.value = ''
    if (rfb && text) rfb.clipboardPasteFrom(text)
  })

  // 输入法组合结束（回车上屏、候选词上屏等）同样以粘贴方式注入，
  // 既不依赖 keysym 映射，也天然支持中文等非 ASCII 字符。
  keyboardProxy.addEventListener('compositionend', () => {
    const text = keyboardProxy.value
    keyboardProxy.value = ''
    if (rfb && text) rfb.clipboardPasteFrom(text)
  })

  keyboardProxy.addEventListener('keydown', (e) => {
    // 输入法组合期间的回车是“上屏候选词”，不能当远程回车发送。
    // keyCode 229 是老 Android WebView 在组合期的兼容值。
    if (e.isComposing || e.keyCode === 229) return

    // 代理框已占位时按回车提交。这里必须发真正的 Enter 键，
    // 不能用 clipboardPasteFrom('\n')：非 extended clipboard 服务端只会粘贴一个换行字符，
    // 远程系统的确认/登录框不会因此提交。
    if (e.key === 'Enter') {
      e.preventDefault()
      if (rfb && rfbConnected) rfb.sendKey(0xFF0D, 'Enter')
    } else if (e.key === 'Escape') {
      keyboardProxy.blur()
      focusDesktop()
    }
  })

  keyboardProxy.addEventListener('blur', () => focusDesktop())

  // 移动端软键盘弹出时浏览器会压缩可视高度，重新触发 noVNC 的画面缩放计算。
  // 同时把键盘高度写进 --kb-height：底部控制栏与剪贴板面板据此上移，避免被键盘遮住。
  // visualViewport 的 scroll 在键盘动画期间会高频触发，只在数值真正变化时才广播 resize，
  // 避免每帧让 noVNC 重算一次缩放。
  if (window.visualViewport) {
    let lastInset = -1
    const syncKeyboardInset = () => {
      const vv = window.visualViewport
      const inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop)
      // 桌面端窗口缩放也可能产生几十像素差值，超过 120px 才认定为软键盘
      const normalized = inset > 120 ? Math.round(inset) : 0
      if (normalized === lastInset) return
      lastInset = normalized
      document.documentElement.style.setProperty('--kb-height', `${normalized}px`)
      window.dispatchEvent(new Event('resize'))
    }
    window.visualViewport.addEventListener('resize', syncKeyboardInset)
    window.visualViewport.addEventListener('scroll', syncKeyboardInset)
    syncKeyboardInset()
  }

  // ---- 状态条 ----
  function showStatus(text, type = 'normal', autohide = 3000) {
    clearTimeout(statusTimer)
    statusEl.textContent = text
    statusEl.className = `open ${type}`
    if (autohide > 0) {
      statusTimer = setTimeout(() => statusEl.classList.remove('open'), autohide)
    }
  }
  statusEl.addEventListener('click', () => statusEl.classList.remove('open'))

  // ---- 控制栏开关 ----
  function toggleControlBar() {
    const open = controlBar.classList.toggle('open')
    barHandle.setAttribute('aria-expanded', open ? 'true' : 'false')
  }
  barHandle.addEventListener('click', toggleControlBar)
  barHandle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault()
      toggleControlBar()
    }
  })

  // ---- 面板开关（点击外部关闭） ----
  function togglePanel(panel) {
    const isOpen = panel.classList.contains('open')
    document.querySelectorAll('.noVNC_panel').forEach(p => p.classList.remove('open'))
    if (!isOpen) panel.classList.add('open')
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.noVNC_panel') && !e.target.closest('.noVNC_button')) {
      document.querySelectorAll('.noVNC_panel').forEach(p => p.classList.remove('open'))
    }
  })

  btnClipboard.addEventListener('click', (e) => {
    e.stopPropagation()
    togglePanel(panelClipboard)
    // 手机端点开剪贴板通常就是要粘贴：自动聚焦面板输入框，省一次点击。
    // 必须在同一次用户手势内同步 focus：iOS 只允许手势上下文里的同步聚焦唤起软键盘，
    // 旧实现延迟 400ms 再聚焦会被判定为脚本主动聚焦而静默失败。
    // 强制读取一次布局，确保 .open 的 visibility 已生效后再聚焦。
    if (isTouchDevice && panelClipboard.classList.contains('open')) {
      try {
        void panelClipboard.offsetHeight
        clipboardText.focus({ preventScroll: true })
      } catch {}
    }
  })

  // 剪贴板只在内容真正变化时同步（change 监听在本文件「剪贴板同步」段），不再叠加 blur：
  // 浏览器规定编辑后失焦会先 change 再 blur，双监听会让同一内容向远端发送两次；
  // 且「只看不改」失焦还会把远端 clipboard 事件填充的旧内容回送远端。
  // 移动端键盘「完成」引发的失焦同样会先触发 change，无需额外监听。

  // ---- 全屏 ----
  // iPhone Safari 不支持元素级 Fullscreen API；退化为 CSS 伪全屏（fixed 铺满）保证可用。
  function isNativeFullscreen() {
    return Boolean(document.fullscreenElement || document.webkitFullscreenElement)
  }

  function toggleFullscreen() {
    if (isNativeFullscreen()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen
      const result = exit?.call(document)
      if (result && typeof result.catch === 'function') result.catch(() => {})
      return
    }

    const el = document.documentElement
    const request = el.requestFullscreen || el.webkitRequestFullscreen
    if (typeof request === 'function' && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) {
      const result = request.call(el)
      // 旧 WebKit 返回 undefined 且失败走 fullscreenerror 事件，不能只依赖 Promise 拒绝
      if (result && typeof result.catch === 'function') {
        result.catch(() => document.body.classList.add('novnc-pseudo-fullscreen'))
        return
      }
    }

    document.body.classList.toggle('novnc-pseudo-fullscreen')
  }

  function enterPseudoFullscreen() {
    document.body.classList.add('novnc-pseudo-fullscreen')
  }

  document.addEventListener('fullscreenchange', () => {
    document.body.classList.remove('novnc-pseudo-fullscreen')
  })
  document.addEventListener('webkitfullscreenchange', () => {
    document.body.classList.remove('novnc-pseudo-fullscreen')
  })
  // 原生全屏失败（旧 WebKit 经事件上报）时回退伪全屏
  document.addEventListener('fullscreenerror', () => {
    if (!isNativeFullscreen()) enterPseudoFullscreen()
  })
  document.addEventListener('webkitfullscreenerror', () => {
    if (!isNativeFullscreen()) enterPseudoFullscreen()
  })

  btnFullscreen.addEventListener('click', toggleFullscreen)

  function exitPseudoFullscreen() {
    document.body.classList.remove('novnc-pseudo-fullscreen')
    window.dispatchEvent(new Event('resize'))
  }

  // 伪全屏下按 Esc 退出（外接键盘场景）。
  // 必须用捕获阶段：noVNC 的 Keyboard 把 keydown 挂在 canvas 上并无条件
  // stopEvent（stopPropagation + preventDefault），冒泡阶段到不了 document，
  // 远程桌面聚焦时 Esc 永远退不出伪全屏。捕获阶段只处理伪全屏期间，不影响正常按键转发。
  document.addEventListener(
    'keydown',
    (e) => {
      if (e.key === 'Escape' && document.body.classList.contains('novnc-pseudo-fullscreen')) {
        exitPseudoFullscreen()
      }
    },
    true,
  )

  // 横竖屏切换后通知 noVNC 重算缩放；部分浏览器 orientationchange 早于尺寸更新，故延迟一拍
  window.addEventListener('orientationchange', () => {
    setTimeout(() => window.dispatchEvent(new Event('resize')), 300)
  })

  // ---- Ctrl+Alt+Del ----
  btnCad.addEventListener('click', () => {
    if (!requireRemoteReady()) return
    rfb.sendCtrlAltDel()
  })

  // ---- 断开 ----
  btnDisconnect.addEventListener('click', () => rfb?.disconnect())

  // ---- 重试 ----
  btnRetry.addEventListener('click', connectVnc)

  // ---- 剪贴板同步 ----
  // textarea 的 change 只在失焦时触发，移动端键盘弹出期间用户很难制造一次可靠失焦，
  // 因此面板里补一个显式「发送到远程」按钮；change 保留为桌面端编辑后的自动同步。
  function syncClipboardToRemote(showFeedback) {
    if (!(rfb && rfbConnected)) {
      if (showFeedback) showStatus('远程桌面尚未连接，请先重新连接', 'warn', 2500)
      return
    }

    const text = clipboardText.value
    if (text === '') {
      if (showFeedback) showStatus('剪贴板内容为空，未发送', 'warn', 1800)
      return
    }

    if (text === lastSentClipboard) {
      if (showFeedback) showStatus('剪贴板内容未变化，无需重复发送', 'normal', 1800)
      return
    }

    lastSentClipboard = text
    rfb.clipboardPasteFrom(text)
    if (showFeedback) showStatus('剪贴板内容已发送到远程桌面', 'normal', 2000)
  }

  btnClipboardSend.addEventListener('click', (e) => {
    e.stopPropagation()
    syncClipboardToRemote(true)
  })

  clipboardText.addEventListener('change', () => {
    syncClipboardToRemote(false)
  })

  // ---- 错误/成功状态 ----
  function setConnected(yes) {
    rfbConnected = Boolean(yes)
    btnCad.disabled = !yes
    btnDisconnect.disabled = !yes
    btnClipboardSend.disabled = !yes
  }

  function showError(msg) {
    transEl.classList.remove('show')
    errorMsgEl.textContent = msg || '未知错误'
    errorEl.classList.add('show')
    setConnected(false)
    notifyParent('error', String(msg || '未知错误'))
  }

  function hideError() {
    errorEl.classList.remove('show')
  }

  // ---- URL 参数工具 ----
  function q(name, def = '') {
    return new URLSearchParams(location.search).get(name) || def
  }

  function readCookieValue(name) {
    try {
      const prefix = `${encodeURIComponent(name)}=`
      const segments = document.cookie ? document.cookie.split('; ') : []
      for (const segment of segments) {
        if (segment.startsWith(prefix)) {
          return decodeURIComponent(segment.slice(prefix.length))
        }
      }
    } catch {}

    return ''
  }

  function getAuthToken() {
    return String(readCookieValue('client_token') || '').trim()
  }

  function buildRequestHeaders(extraHeaders = {}) {
    const token = getAuthToken()
    return {
      Accept: 'application/json',
      'X-Requested-With': 'XMLHttpRequest',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...extraHeaders,
    }
  }

  // 跨域 iframe 场景下 location.origin 指向 noVNC 宿主，相对路径无法命中业务后端，
  // 因此允许宿主通过 URL 参数 api_base 显式指定业务 API 的绝对基址。
  function resolveApiUrl(path) {
    const rawPath = String(path || '')
    if (/^https?:\/\//i.test(rawPath)) return rawPath

    const apiBase = String(q('api_base', '') || '').trim().replace(/\/+$/, '')
    if (!/^https?:\/\//i.test(apiBase)) {
      throw new Error('VNC API 基址缺失或无效')
    }
    return new URL(rawPath, `${apiBase}/`).toString()
  }

  function isCrossOriginRequest(resolvedUrl) {
    if (!/^https?:\/\//i.test(resolvedUrl)) return false
    try {
      return new URL(resolvedUrl).origin !== location.origin
    } catch {
      return false
    }
  }

  async function readJson(url, options = {}, fallbackMessage = '请求失败') {
    const resolvedUrl = resolveApiUrl(url)
    const res = await fetch(resolvedUrl, {
      // 跨域请求默认不带凭证，避免 CORS 预检失败；同域保留 include 以兼容 Cookie Session
      credentials: isCrossOriginRequest(resolvedUrl) ? 'omit' : 'include',
      headers: buildRequestHeaders(options.headers || {}),
      ...options,
    })
    const json = await res.json().catch(() => ({}))
    if (!res.ok || json.code !== 0) {
      throw new Error(json.message || fallbackMessage)
    }
    return json.data || {}
  }

  function buildRelayUrl(p) {
    const token = String(p.token || '').trim()
    const relayPath = String(p.relay_path || '').trim()
    if (!token || !relayPath) return ''

    // relay_path 属于 API 站点；不能按 noVNC 页面所在 console 域名解析。
    const apiBase = String(q('api_base', '') || '').trim().replace(/\/+$/, '')
    if (!/^https?:\/\//i.test(apiBase)) return ''

    const relayUrl = new URL(relayPath, `${apiBase}/`)
    if (relayUrl.protocol === 'https:') {
      relayUrl.protocol = 'wss:'
    } else if (relayUrl.protocol === 'http:') {
      relayUrl.protocol = 'ws:'
    }
    relayUrl.searchParams.set('token', token)
    return relayUrl.toString()
  }

  function buildWsUrl(p) {
    const relayUrl = buildRelayUrl(p)
    if (relayUrl) return relayUrl
    return ''
  }

  function buildInitialCredentials(params) {
    const creds = {}
    const username = String(params?.username || '').trim()
    const target = String(params?.target || '').trim()
    const password = String(params?.password ?? '').trim()
    const hasPasswordParam = Object.prototype.hasOwnProperty.call(params || {}, 'password')

    if (username) {
      creds.username = username
    }

    if (target) {
      creds.target = target
    }

    if (password || hasPasswordParam) {
      creds.password = password
    }

    // 只有确实拿到密码（含显式空密码）时才提交。完全没凭据时不伪造空密码，
    // 让 credentialsrequired 分支给出“缺少免密认证参数”的明确提示，
    // 否则会反复提交空密码，最终表现为“连接已中断”。
    return creds
  }

  function normalizeVncCredentialsPayload(payload) {
    if (!payload || typeof payload !== 'object') return null

    const credentials = {}
    const username = String(payload.username || '').trim()
    const target = String(payload.target || '').trim()
    const password = String(payload.password || '').trim()

    if (username) credentials.username = username
    if (target) credentials.target = target
    if (password) credentials.password = password

    return Object.keys(credentials).length > 0 ? credentials : null
  }

  function mergeVncCredentials(params, credentials) {
    const normalized = normalizeVncCredentialsPayload(credentials)
    if (!normalized) return params

    return { ...params, ...normalized }
  }

  // 凭据经 URL fragment（#vnc_auth=<base64url>）随链接进入查看器页面：
  // fragment 不会发送到服务器，读取后立即 replaceState 清除，不再落 sessionStorage。
  // 另在内存保留最近一次成功凭据，供重连/renew 时兜底（不落任何 storage）。
  let cachedVncCredentials = null

  function decodeVncCredentialsFragment(encoded) {
    try {
      let normalized = String(encoded || '').replace(/-/g, '+').replace(/_/g, '/')
      while (normalized.length % 4) normalized += '='
      const bytes = Uint8Array.from(atob(normalized), (ch) => ch.charCodeAt(0))
      return normalizeVncCredentialsPayload(JSON.parse(new TextDecoder().decode(bytes)))
    } catch {
      return null
    }
  }

  function readAndClearFragmentCredentials() {
    const rawHash = String(location.hash || '')
    if (rawHash.length < 2) return null

    const encoded = String(new URLSearchParams(rawHash.replace(/^#/, '')).get('vnc_auth') || '').trim()
    if (!encoded) return null

    const credentials = decodeVncCredentialsFragment(encoded)
    // 无论解析成败都清掉 fragment，避免凭据停留在地址栏与当前历史条目中
    try { history.replaceState(null, '', location.pathname + location.search) } catch {}

    return credentials
  }

  function withFragmentVncCredentials(params, fallbackCredentials = null) {
    const credentials = fallbackCredentials || readAndClearFragmentCredentials() || cachedVncCredentials
    const normalized = normalizeVncCredentialsPayload(credentials)
    if (normalized) cachedVncCredentials = normalized

    return mergeVncCredentials(params, normalized)
  }

  async function renewParamsByServiceId(serviceId) {
    const id = Number(serviceId || 0)
    if (!Number.isFinite(id) || id <= 0) {
      throw new Error('服务编号无效，无法重新获取 VNC 连接')
    }

    const data = await readJson(`/api/v2/client/services/${id}/vnc`, {}, '重新获取 VNC 连接失败')
    const freshUrl = String(data.url || '').trim()
    if (!freshUrl) {
      throw new Error('未获取到新的 VNC 链接')
    }
    const freshCredentials = normalizeVncCredentialsPayload(data.vnc_credentials)
    // renew 会 replaceState 换掉当前 URL，先读走 fragment 中的凭据作为兜底
    const fragmentCredentials = readAndClearFragmentCredentials()

    const freshLocation = new URL(freshUrl, location.origin)
    freshLocation.searchParams.set('service_id', String(id))
    // 如果后端未回填 api_base，则继承当前页面的 api_base，避免 renew 后跨域请求失效
    const currentApiBase = q('api_base', '')
    if (currentApiBase && !freshLocation.searchParams.get('api_base')) {
      freshLocation.searchParams.set('api_base', currentApiBase)
    }
    history.replaceState(null, '', freshLocation.toString())

    const freshToken = freshLocation.searchParams.get('token')
    const freshRelayPath = freshLocation.searchParams.get('relay_path')
    if (freshToken) {
      const relaySession = await readJson(`/api/v2/client/vnc-tokens/${encodeURIComponent(freshToken)}`, {}, '新的 VNC 链接已失效')
      return withFragmentVncCredentials({
        token: freshToken,
        ...relaySession,
        relay_path: freshRelayPath || relaySession.relay_path || '',
      }, freshCredentials || fragmentCredentials)
    }

    return mergeVncCredentials({
      host: freshLocation.searchParams.get('host') || '',
      port: freshLocation.searchParams.get('port') || '',
      password: freshLocation.searchParams.get('password') || '',
      path: freshLocation.searchParams.get('path') || 'websockify',
      encrypt: freshLocation.searchParams.get('encrypt') || (location.protocol === 'https:' ? '1' : '0'),
      username: freshLocation.searchParams.get('username') || '',
      target: freshLocation.searchParams.get('target') || '',
    }, freshCredentials || fragmentCredentials)
  }

  async function resolveParams() {
    const token = q('token')
    const relayPath = q('relay_path')
    const serviceId = q('service_id') || q('sid')
    if (token) {
      try {
        const relaySession = await readJson(`/api/v2/client/vnc-tokens/${encodeURIComponent(token)}`, {}, 'VNC 链接已失效，请重新获取')
        return withFragmentVncCredentials({
          token,
          ...relaySession,
          relay_path: relayPath || relaySession.relay_path || '',
        })
      } catch (error) {
        if (serviceId) {
          return await renewParamsByServiceId(serviceId)
        }
        throw error
      }
    }

    if (serviceId && !q('host') && !q('port')) {
      return await renewParamsByServiceId(serviceId)
    }

    return {
      host: q('host', location.hostname),
      port: q('port', location.port),
      path: q('path', 'websockify'),
      encrypt: q('encrypt', location.protocol === 'https:' ? '1' : '0'),
      username: q('username'),
      target: q('target'),
      password: q('password') || q('pass'),
    }
  }

  // ---- 主连接逻辑 ----

  /**
   * 旁听 RFB 底层 WebSocket 的 close 事件，取出 Relay 下发的关闭原因。
   *
   * noVNC 的 disconnect 事件只带 clean 标记，会把 code/reason 丢在日志里。Relay 在
   * 「上游握手成功但一直没有 RFB 数据」时会以 1011 + 原因关闭，用户需要看到
   * 「上游 VNC 无响应」而不是笼统的连接中断。RFB 实例在构造时同步建好 _sock，
   * 这里挂到它内部 WebSocket 的 onclose 之前即可（noVNC 自身 handler 不变）。
   */
  function watchRelayCloseReason(rfbInstance, onReason) {
    try {
      const sock = rfbInstance?._sock?._websocket
      if (!sock) return
      sock.addEventListener('close', (event) => {
        if (!event || event.wasClean === false) return
        const reason = String(event.reason || '').trim()
        if (!reason) return
        onReason(reason)
      })
    } catch (_) {
      // 旁听失败不影响主连接流程
    }
  }

  async function connectVnc() {
    if (rfb) { try { rfb.disconnect() } catch (_) {} rfb = null }
    hideError()
    setConnected(false)
    notifyParent('connecting')
    transText.textContent = '正在连接远程桌面...'
    transEl.classList.add('show')

    try {
      const params = await resolveParams()
      const url = buildWsUrl(params)
      if (!url) throw new Error('VNC 连接参数无效')

      const creds = buildInitialCredentials(params)
      let emptyPasswordTried = false
      let disconnectMessage = ''

      rfb = new RFB(container, url, { credentials: creds })
      // Relay 在上游长时间无数据时会带着原因关闭（1011）。noVNC 自身的 disconnect
      // 事件里拿不到 reason，这里在底层 WebSocket 上旁听一次，把原因透给错误层。
      watchRelayCloseReason(rfb, (message) => { disconnectMessage = message })
      rfb.scaleViewport = true
      // 部分上游 VNC 服务不支持 noVNC 的远程分辨率协商，开启后会持续警告 Invalid screen layout。
      // 保留本地缩放即可，避免向服务端发送 resize 请求。
      rfb.resizeSession = false
      rfb.background    = '#313131'

      rfb.addEventListener('connect', () => {
        transEl.classList.remove('show')
        setConnected(true)
        // 新会话的远端剪贴板状态未知，清掉上一会话的去重值，允许重发相同内容。
        lastSentClipboard = null
        showStatus('已连接', 'normal', 3000)
        controlBar.classList.remove('open')
        window.dispatchEvent(new Event('resize'))
        notifyParent('connected')
      })

      rfb.addEventListener('disconnect', (e) => {
        setConnected(false)
        // 无论断开是否干净都要收起“正在连接”遮罩；否则连接建立前被关闭时
        // 页面会永远停留在“正在连接远程桌面…”，看起来像卡死。
        transEl.classList.remove('show')
        if (e.detail?.clean) {
          showStatus('已断开连接', 'normal', 4000)
          notifyParent('disconnected')
        } else {
          showError(disconnectMessage || ('VNC 连接已中断，请重新尝试\n\n目标地址：' + url))
        }
      })

      rfb.addEventListener('desktopname', (e) => {
        const name = String(e.detail?.name || '')
        if (name) showStatus(`已连接：${name}`, 'normal', 4000)
      })

      rfb.addEventListener('clipboard', (e) => {
        clipboardText.value = e.detail?.text || ''
        // 远端下发的剪贴板只做展示，不能因为后续失焦产生的 change 又回送远端。
        lastSentClipboard = clipboardText.value
      })

      rfb.addEventListener('credentialsrequired', async () => {
        if (creds.password !== undefined) {
          rfb.sendCredentials(creds)
          return
        }

        // 兼容密码为空的服务端：旧行为会提交空密码。只尝试一次，
        // 失败后不再循环提交空密码，而是给出明确提示。
        if (!emptyPasswordTried) {
          emptyPasswordTried = true
          rfb.sendCredentials({ ...creds, password: '' })
          return
        }

        showError('VNC 免密认证参数缺失，请刷新连接后重试')
      })

    } catch (err) {
      const detail = err?.message || 'VNC 连接失败'
      showError(detail)
      console.error('[VNC] connectVnc 失败:', detail, err)
    }
  }

  window.addEventListener('beforeunload', () => { try { rfb?.disconnect() } catch (_) {} })

  connectVnc()
</script>
</body>
</html>
