<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的服务 - 页面 Demo</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.9.7/dist/index.css" />
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.9.7/dist/index.full.min.js"></script>
<script src="https://unpkg.com/@element-plus/icons-vue@2/dist/index.iife.min.js"></script>
<style>
/* ===== Variables (from variables.scss) ===== */
:root {
  --color-primary: #165dff;
  --color-primary-hover: #0e4fcc;
  --color-primary-soft: #e8f1ff;
  --color-primary-border: #c9dbff;
  --color-success: #12b76a;
  --color-warning: #f59e0b;
  --color-danger: #f04438;
  --color-info: #5b6b82;
  --bg-color: #f5f7fb;
  --bg-color-soft: #f8fafc;
  --bg-color-card: #ffffff;
  --text-color-primary: #1f2937;
  --text-color-secondary: #5b6b82;
  --text-color-placeholder: #94a0b2;
  --border-color: #e5eaf3;
  --divider-color: #eef2f7;
  --border-color-strong: #cfd8e6;
  --base-border-radius: 14px;
  --sm-border-radius: 10px;
  --shadow-sm: 0 2px 10px rgba(15,23,42,0.04);
  --shadow-md: 0 10px 30px rgba(15,23,42,0.06);
  --motion-fast: 0.15s;
  --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-family);
  background: var(--bg-color);
  color: var(--text-color-primary);
  font-size: 14px;
  line-height: 1.5;
}

/* ===== Page Shell ===== */
.client-page {
  display: flex;
  flex-direction: column;
  gap: 18px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px;
}

/* ===== Page Head ===== */
.client-page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.client-page-heading h2 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-color-primary);
}

.client-page-heading p {
  margin-top: 4px;
  color: var(--text-color-secondary);
  font-size: 14px;
}

.client-page-actions {
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}

/* ===== Filter Card ===== */
.service-filter-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
  border: 1px solid var(--border-color);
  border-radius: var(--base-border-radius);
  background: var(--bg-color-card);
}

.service-filter-row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.service-filter-row--selects .el-select {
  flex: 1;
  min-width: 0;
}

.service-filter-row--actions {
  flex-wrap: wrap;
}

.service-filter-row--actions .el-button {
  min-width: 64px;
}

.service-filter-spacer {
  flex: 1 1 auto;
  min-width: 0;
}

/* View mode toggle */
.service-view-switch__group {
  display: inline-flex;
}

.service-view-switch__group .el-radio-button:first-child .el-radio-button__inner {
  border-top-left-radius: 8px;
  border-bottom-left-radius: 8px;
}

.service-view-switch__group .el-radio-button:last-child .el-radio-button__inner {
  border-top-right-radius: 8px;
  border-bottom-right-radius: 8px;
}

.service-view-switch__group .el-radio-button__inner {
  min-width: 64px;
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--border-color);
  background: linear-gradient(135deg, rgba(247,248,250,0.96) 0%, rgba(241,244,248,0.92) 100%);
  box-shadow: none;
  color: var(--text-color-secondary);
  font-size: 12px;
  font-weight: 600;
  line-height: 32px;
}

.service-view-switch__group .el-radio-button__original-radio:checked + .el-radio-button__inner {
  background: #fff;
  border-color: rgba(255,140,63,0.28);
  color: var(--color-primary);
  box-shadow: 0 4px 10px rgba(15,23,42,0.08);
}

.service-view-switch__group .el-radio-button:not(:first-child) .el-radio-button__inner {
  margin-left: -1px;
}

/* ===== Service Card Grid ===== */
.service-card-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  align-items: stretch;
}

/* ===== Service Card ===== */
.service-row-card {
  min-width: 0;
  height: 100%;
  padding: 16px 18px 14px;
  border: 1px solid #dce3ed;
  border-radius: var(--sm-border-radius);
  background: var(--bg-color-card);
  box-shadow: 0 4px 14px rgba(31,35,41,0.05);
  transition: border-color var(--motion-fast) ease, box-shadow var(--motion-fast) ease, transform var(--motion-fast) ease;
}

.service-row-card:hover {
  border-color: var(--color-primary-border);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.service-row-head {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  min-width: 0;
}

.service-system-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  flex: none;
}

.service-system-icon__fallback {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--color-primary-soft);
  color: var(--color-primary);
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
}

.service-row-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-width: 0;
}

.service-row-topline {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 12px;
  min-width: 0;
}

.service-row-titleblock { min-width: 0; }

.service-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.service-name-button {
  padding: 0;
  border: none;
  background: transparent;
  color: var(--text-color-primary);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-size: 15px;
  font-weight: 700;
  text-align: left;
  line-height: 1.35;
  cursor: pointer;
  display: block;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.service-name-button:hover { color: var(--color-primary); }

.service-row-id {
  flex: none;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--bg-color-soft);
  color: var(--text-color-placeholder);
  font-size: 10px;
  line-height: 1;
  white-space: nowrap;
}

.service-remark-line {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  margin-top: 5px;
  color: var(--text-color-secondary);
  font-size: 12px;
  line-height: 1.35;
}

.service-remark-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.service-remark-text.empty { color: var(--text-color-placeholder); }

.service-remark-trigger {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--color-primary);
  cursor: pointer;
  flex: none;
  font-size: 14px;
}

.service-row-actions {
  display: flex;
  align-items: center;
  justify-self: end;
  gap: 8px;
  flex: none;
  white-space: nowrap;
}

.service-action-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 0 4px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--color-primary);
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: color var(--motion-fast) ease, background-color var(--motion-fast) ease, border-color var(--motion-fast) ease;
}

.service-action-link:hover {
  border-color: rgba(22,93,255,0.1);
  background: var(--color-primary-soft);
}

.service-action-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 32px;
  padding: 0 12px;
  border: 1px solid var(--border-color-strong);
  border-radius: 8px;
  background: var(--bg-color-card);
  color: var(--color-primary);
  font-size: 13px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: color var(--motion-fast) ease, background-color var(--motion-fast) ease, border-color var(--motion-fast) ease;
}

.service-action-button:hover {
  border-color: var(--color-primary-border);
  background: var(--color-primary-soft);
}

.service-more-button::after {
  content: '';
  display: inline-block;
  margin-left: 6px;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid currentColor;
  vertical-align: middle;
}

.service-spec-line {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0;
  min-width: 0;
  margin-top: 14px;
  color: var(--text-color-secondary);
  font-size: 13px;
  line-height: 1.7;
}

.service-spec-line span { min-width: 0; white-space: nowrap; }

.service-spec-line span + span {
  position: relative;
  margin-left: 10px;
  padding-left: 10px;
}

.service-spec-line span + span::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 1px;
  height: 10px;
  background: var(--divider-color);
  transform: translateY(-50%);
}

.service-expire-line {
  margin-top: 4px;
  color: var(--text-color-secondary);
  font-size: 13px;
  line-height: 1.7;
}

.service-expire-line.warning { color: var(--color-warning); }

.service-row-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--divider-color);
}

.service-status-line {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  color: var(--text-color-secondary);
  font-size: 13px;
  font-weight: 600;
}

.service-status-line.is-success { color: var(--color-success); }
.service-status-line.is-warning { color: var(--color-warning); }
.service-status-line.is-danger  { color: var(--color-danger); }
.service-status-line.is-primary { color: var(--color-primary); }

.service-status-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 2px solid currentColor;
  border-radius: 999px;
  background: var(--bg-color-card);
  flex: none;
}

.service-ip-line {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  color: var(--text-color-placeholder);
  font-size: 12px;
}

.service-ip-label { flex: none; }

.service-ip-value {
  color: var(--text-color-primary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
}

.service-ip-value:hover { color: var(--color-primary); }

/* ===== Pagination ===== */
.service-pagination {
  display: flex;
  justify-content: flex-end;
}

/* ===== Responsive ===== */
@media (max-width: 1440px) {
  .service-card-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 1180px) {
  .service-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
}

@media (max-width: 960px) {
  .service-filter-card { padding: 12px; gap: 8px; }
  .service-filter-row--actions .el-button { flex: 1; }
  .service-filter-spacer { display: none; }
  .service-view-switch__group .el-radio-button__inner { min-width: 0; padding: 0 10px; }
}

@media (max-width: 767px) {
  .service-card-grid { grid-template-columns: 1fr; }
  .client-page { padding: 16px 12px; }
  .service-row-card { padding: 14px; }
  .service-row-head { gap: 12px; }
  .service-system-icon, .service-system-icon__fallback { width: 32px; height: 32px; }
  .service-name-button { font-size: 14px; }
  .service-spec-line, .service-expire-line { font-size: 12px; }
}
</style>
</head>
<body>

<div id="app">
  <div class="client-page service-page">
    <!-- Page Head -->
    <section class="client-page-head">
      <div class="client-page-heading">
        <h2>我的服务</h2>
        <p>查看账号下全部实例，快速处理续费、到期提醒与实例进入控制台操作。</p>
      </div>
      <div class="client-page-actions">
        <el-button>
          <el-icon><refresh-right /></el-icon>
          刷新数据
        </el-button>
        <el-button type="primary">
          <el-icon><plus /></el-icon>
          购买新服务
        </el-button>
      </div>
    </section>

    <!-- Filter Card -->
    <div class="service-filter-card">
      <div class="service-filter-row service-filter-row--selects">
        <el-select v-model="filters.status" clearable placeholder="全部状态">
          <el-option label="已开通" value="active" />
          <el-option label="已暂停" value="suspended" />
          <el-option label="已到期" value="expired" />
          <el-option label="开通中" value="pending" />
        </el-select>

        <el-select v-model="filters.catalog_type" clearable placeholder="全部分类">
          <el-option label="全部分类" value="" />
          <el-option label="轻量云 (3)" value="light_cloud" />
          <el-option label="独立服务器 (1)" value="dedicated" />
        </el-select>
      </div>

      <el-input
        v-model="filters.keyword"
        clearable
        placeholder="搜索服务名称、域名、订单号"
      >
        <template #suffix>
          <el-icon><search /></el-icon>
        </template>
      </el-input>

      <div class="service-filter-row service-filter-row--actions">
        <el-button type="primary">搜索</el-button>
        <el-button>重置</el-button>

        <div class="service-filter-spacer"></div>

        <el-radio-group v-model="viewMode" class="service-view-switch__group">
          <el-radio-button value="grid">卡片</el-radio-button>
          <el-radio-button value="list">列表</el-radio-button>
        </el-radio-group>
      </div>
    </div>

    <!-- Service Card Grid -->
    <div class="service-card-grid">
      <article v-for="item in mockServices" :key="item.id" class="service-row-card">
        <div class="service-row-head">
          <div class="service-system-icon">
            <span class="service-system-icon__fallback">{{ item.icon }}</span>
          </div>
          <div class="service-row-body">
            <div class="service-row-topline">
              <div class="service-row-titleblock">
                <div class="service-title-row">
                  <button type="button" class="service-name-button">{{ item.name }}</button>
                  <span class="service-row-id">ID {{ item.id }}</span>
                </div>
                <div class="service-remark-line">
                  <span class="service-remark-text" :class="{ empty: !item.remark }">{{ item.remark || '添加备注' }}</span>
                  <button type="button" class="service-remark-trigger">✏️</button>
                </div>
              </div>
              <div class="service-row-actions">
                <button type="button" class="service-action-link">控制台</button>
                <button type="button" class="service-action-button service-more-button">更多</button>
              </div>
            </div>

            <div class="service-spec-line">
              <span>CPU {{ item.cpu }}</span>
              <span>内存 {{ item.ram }}</span>
              <span>带宽 {{ item.bw }}</span>
            </div>

            <div class="service-expire-line" :class="{ warning: item.expiringSoon }">
              到期时间：{{ item.expires }}
            </div>

            <div class="service-row-foot">
              <div class="service-status-line" :class="`is-${item.tone}`">
                <i class="service-status-dot"></i>
                <span>{{ item.statusLabel }}</span>
              </div>
              <div class="service-ip-line">
                <span class="service-ip-label">公网 IP</span>
                <span class="service-ip-value">{{ item.ip }}</span>
              </div>
            </div>
          </div>
        </div>
      </article>
    </div>

    <!-- Pagination -->
    <div class="service-pagination">
      <el-pagination
        :current-page="1"
        :page-size="10"
        :page-sizes="[10, 20, 50]"
        :total="mockServices.length"
        layout="total, sizes, prev, pager, next"
      />
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive } = Vue

const app = createApp({
  setup() {
    const filters = reactive({
      status: 'active',
      catalog_type: '',
      keyword: '',
    })
    const viewMode = ref('grid')

    const mockServices = ref([
      {
        id: 89,
        name: '美国轻量云 2H2G',
        icon: '🖥',
        remark: '',
        cpu: '2核',
        ram: '2G',
        bw: '30Mbps',
        expires: '2026-05-19 15:56:32',
        expiringSoon: false,
        statusLabel: '已激活',
        tone: 'success',
        ip: '154.193.217.208',
      },
      {
        id: 102,
        name: '香港轻量云 4H4G',
        icon: '🖥',
        remark: '主站服务器',
        cpu: '4核',
        ram: '4G',
        bw: '50Mbps',
        expires: '2026-04-25 08:30:00',
        expiringSoon: true,
        statusLabel: '即将到期',
        tone: 'warning',
        ip: '103.45.67.89',
      },
      {
        id: 76,
        name: '日本独立服务器 E5',
        icon: '🗄',
        remark: '数据库专用',
        cpu: '8核',
        ram: '16G',
        bw: '100Mbps',
        expires: '2026-08-01 00:00:00',
        expiringSoon: false,
        statusLabel: '已激活',
        tone: 'success',
        ip: '45.76.123.45',
      },
    ])

    return { filters, viewMode, mockServices }
  },
})

app.use(ElementPlus)
for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
  app.component(key, component)
}
app.mount('#app')
</script>

</body>
</html>
