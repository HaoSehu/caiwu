<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <meta name="theme-color" content="#165dff" />
  <meta name="description" content="创欧云 — 稳定、安全、高性价比的云服务器与 IDC 服务平台，覆盖香港、美国与国内多地节点，提供云服务器、独立服务器、云电脑与工单支持。" />
  <meta name="keywords" content="云服务器,独立服务器,高防服务器,云电脑,香港服务器,美国服务器,BGP 多线,IDC 服务,创欧云" />
  <meta name="author" content="创欧云" />
  <meta name="robots" content="index,follow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>创欧云 - 稳定、安全、高性价比的云服务器与 IDC 服务平台</title>
  <link rel="icon" type="image/svg+xml" href="/branding/logo1.svg" />
  <link rel="alternate" hreflang="zh-CN" href="/" />
</head>
<body>
  <div id="app">
    <!-- 初始加载动画：JS 解析完成前展示，Vue 挂载后自动替换 -->
    <div id="app-splash" aria-label="页面加载中">
      <style>
        #app-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          background: linear-gradient(168deg, #f8fafc 0%, #f0f4ff 100%);
          z-index: 9999;
          opacity: 1;
          transition: opacity 0.3s ease-out;
        }
        #app-splash.fade-out {
          opacity: 0;
          pointer-events: none;
        }
        #app-splash .splash-logo {
          width: 48px;
          height: 48px;
          animation: splash-breathe 2s ease-in-out infinite;
        }
        #app-splash .splash-bar-track {
          width: 180px;
          height: 3px;
          border-radius: 999px;
          background: rgba(22, 93, 255, 0.1);
          overflow: hidden;
        }
        #app-splash .splash-bar-fill {
          width: 40%;
          height: 100%;
          border-radius: 999px;
          background: linear-gradient(90deg, #165dff, #4d8eff);
          animation: splash-slide 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        }
        @keyframes splash-breathe {
          0%, 100% { transform: scale(1); opacity: 0.92; }
          50% { transform: scale(1.04); opacity: 1; }
        }
        @keyframes splash-slide {
          0% { transform: translateX(-120%); }
          100% { transform: translateX(350%); }
        }
      </style>
      <img class="splash-logo" src="/branding/logo1.svg" alt="创欧云" width="48" height="48" />
      <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
