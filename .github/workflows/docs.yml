name: Documentation checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "backend/scripts/check_docs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  push:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "**/AGENTS.md"
      - "backend/scripts/check_docs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      strict_freshness:
        description: Fail the manual freshness run when review dates are missing or expired.
        required: false
        default: false
        type: boolean

jobs:
  docs-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run docs:check

  docs-freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report documentation freshness
        run: |
          if [ "${{ inputs.strict_freshness }}" = "true" ]; then
            npm run docs:freshness -- --strict-freshness
          else
            npm run docs:freshness
          fi
