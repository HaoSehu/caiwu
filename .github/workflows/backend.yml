name: Backend

# 后端门禁：格式、静态分析、插件来源审计、OpenAPI 规格生成、全量测试。
# 只跑 push 到 main 与 pull_request，不自动部署。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 后端门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idc_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --default-authentication-plugin=mysql_native_password
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: idc_test
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, ctype, json, openssl, pdo_mysql, tokenizer, xml, dom, fileinfo, redis
          coverage: none

      - name: 安装 Composer 依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 生成环境文件
        # .env.example 里 DB_* 是空值，CI 必须写成 service 容器的真实连接值；
        # APP_KEY 供加密类用例使用，testing 之外的 artisan 命令同样需要可启动。
        run: |
          cp .env.example .env
          sed -i "s|^DB_HOST=.*|DB_HOST=${DB_HOST}|" .env
          sed -i "s|^DB_PORT=.*|DB_PORT=${DB_PORT}|" .env
          sed -i "s|^DB_DATABASE=.*|DB_DATABASE=${DB_DATABASE}|" .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=${DB_USERNAME}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" .env
          php artisan key:generate --force

      - name: 安装 MySQL 客户端
        # migrate:fresh 加载 database/schema/mysql-schema.sql 依赖 PATH 中的 mysql 命令；
        # 基础镜像通常自带，缺失时补装，避免在删表后才发现客户端不存在。
        run: |
          if ! command -v mysql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends mysql-client
          fi

      - name: 重建测试库
        run: php artisan test:prepare --force

      - name: 代码格式检查
        run: composer format:check

      - name: 静态分析
        run: composer analyse

      - name: 前端接口清单一致性
        # 生成物 frontend-admin-v3/src/data/apiCatalog.generated.json 由
        # backend/scripts/generate_frontend_api_catalog.php 依据 route:list 产出，
        # 管理端「接口清单」页直接消费它。--check 只比对不写文件：改了路由却没重新生成时这里失败。
        # 修复方式：本地跑 php backend/scripts/generate_frontend_api_catalog.php 后提交生成物。
        run: php scripts/generate_frontend_api_catalog.php --check

      - name: 插件来源审计
        run: composer audit:plugins

      - name: 依赖安全扫描
        # 走 Packagist 的 CVE 通告库扫描 composer.lock 中的生产依赖（--no-dev 跳过 require-dev）。
        # 阻断：发现漏洞时 composer audit 退出码为 1，流水线直接失败。
        # 修复方式：composer update <包名> --with-dependencies 后跑 php artisan test 与 composer analyse。
        # 确实无法升级时（上游无修复版本），在下方显式 --ignore 并注明原因与到期复核日期，不要改成非阻断。
        run: composer audit --no-dev

      - name: OpenAPI 规格生成
        # 只生成到 storage/app/openapi.json，不上传 Apifox：生成失败即失败。
        run: composer api:spec

      - name: 后端 API 清单生成
        # 生成到 docs/自动生成/接口/后端API清单.md（构建产物，不入库）。
        # 两份产物都由路由表派生，下面统一做一致性校验，防止真源漂移。
        run: composer api:inventory

      - name: 接口真源一致性校验
        # 三条真源（路由表 / openapi.json / 后端API清单）必须一致：
        # 路由改了却漏改生成器、或生成器漏掉某类中间件时，这里失败。
        run: composer api:check

      - name: 全量测试
        run: php artisan test
