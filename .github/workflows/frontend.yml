name: Frontend

# 前端门禁：lint、类型检查、三端构建；管理端/官网/控制台 e2e 串行执行（均阻断）。只跑 push 到 main 与 pull_request，不自动部署。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 前端门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 共享层与构建配置单元测试
        # test:shared 覆盖共享运行时/金额格式等纯逻辑，test:build-config 覆盖体积门禁
        # 自身的拦截能力（含「缺 name 必须失败」）。两者此前不在 CI 里，门禁脚本回归无人守。
        run: |
          npm run test:shared
          npm run test:build-config

      - name: 依赖安全扫描
        # 与后端 composer audit --no-dev 对齐：只扫会被打进产物的生产依赖，跳过 lint/e2e 等开发工具链。
        # 阻断：发现漏洞时 npm audit 退出码为 1，流水线直接失败。
        # 修复方式：npm audit fix（非 --force）后跑三端构建与 e2e。确实无法升级时用 --ignore 并注明原因与复核日期。
        # 注意：不带 --omit=dev 时会把 eslint/stylus 等开发依赖的告警也算进来，那不是本步骤要守的边界。
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint:frontends

      - name: 类型检查
        run: npm run typecheck:frontends

      - name: 官网组件体系守卫
        # 官网从 Element Plus 迁到 TDesign Vue Next 后，旧组件体系的依赖、<el-xxx> 标签、
        # --el-* 变量与旧命令式 API 若回流，构建不会失败（未注册标签只渲染成空元素），
        # 必须显式拦截。这三个脚本挂在 npm run verify:refactor 里，但 CI 不走那条链，
        # 故在这里单独执行；都只读源码，不依赖构建产物。
        working-directory: frontend-user-v3-www
        run: |
          npm run check:source-health
          node ./scripts/check-tdesign-resolver.mjs
          node ./scripts/check-no-legacy-ui.mjs

      - name: 构建三端
        run: npm run build:frontends

      - name: 官网构建产物残留守卫
        # 源码层守卫看不到经 node_modules 间接路径打进 dist 的旧样式，
        # 只有对产物本身检查才能证明「现网构建不含旧组件体系」。上一步已产出 dist。
        working-directory: frontend-user-v3-www
        run: node ./scripts/check-no-legacy-ui.mjs --dist

  # 三端 e2e（Playwright + Chromium）：管理端 → 官网 → 控制台，串行执行，全部阻断。
  # - 必须串行：三端 e2e 固定占用 127.0.0.1:4173（backend/scripts/e2e_runner.mjs 里 PORT = 4173，
  #   vite preview 带 --strictPort），同一时间只能跑一端，并发会互抢端口直接失败。
  #   故用 `needs` 串成单链而非 matrix：matrix + max-parallel 只能限并发数，job 之间的启动顺序
  #   仍不保证严格排队，端口竞争窗口依然存在；单个 job 内顺序 step 则会让不同端的失败互相掩盖、
  #   且无法分别重跑。needs 链语义最直白：前一轮结束（成功或失败）才启动下一轮。
  # - 三端步骤口径一致：checkout → setup-node(22, cache npm) → npm ci → 安装 chromium →
  #   在对应工作目录跑 npm run test:e2e。
  # - 阻断机制：三端都不再设 job 级 `continue-on-error`，e2e 失败即本次 Frontend 工作流失败。
  #   本地实测三端均无后端可跑通（2026-10-27）：
  #   · 管理端 37 passed（page.route() 全 mock，见 frontend-admin-v3/e2e/fixtures.ts）
  #   · 控制台 35 passed（page.route() 全 mock，见 frontend-user-v4-console/e2e/fixtures.ts）
  #   · 官网 32 passed（下面的命令行用 --grep-invert @needs-backend 排除依赖真实接口的用例；
  #     全量 38 条，其中 6 条 @needs-backend 需要真实后端，口径变化时同步更新本行。
  #     2026-11-02 TDesign 迁移收尾：本地起后端后全量 38 passed）
  # - 官网 e2e 的真实后端依赖仍在：smoke.spec.ts 的首屏/机型表/商品抽屉与 ux-fixes.spec.ts 的
  #   结算条用例走 vite preview 代理到 127.0.0.1:8000 的真实接口，本地需先起后端全量跑。
  #   CI 无后端，故用 --grep-invert @needs-backend 排除；这些用例已全部打上 @needs-backend 标签，
  #   若新增依赖真实接口的用例，必须同步打标签，否则 CI 会红。
  admin-e2e:
    name: 管理端 e2e
    needs: verify
    runs-on: ubuntu-latest
    # 兜底超时：e2e-run.mjs 会等 4173 端口就绪（上限 60s），但仍给出 job 级上限避免长时间占用 runner。
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        # 管理端 playwright.config.ts 只声明 chromium 一个 project，无需装全部内核。
        run: npx playwright install --with-deps chromium

      - name: 运行管理端 e2e
        # 该脚本内部：vite build --mode e2e → vite preview(4173) → playwright test → 清理进程。
        working-directory: frontend-admin-v3
        run: npm run test:e2e

  www-e2e:
    name: 官网 e2e
    # 串行链：verify → admin-e2e → www-e2e → console-e2e，前一个 e2e 结束后才启动下一个，
    # 保证任何时刻只有一个 vite preview 占用 4173。
    needs: [verify, admin-e2e]
    # 显式条件：上游 e2e 失败时 job 结论是 failure，needs 默认会让下游直接 skipped，
    # 三端 e2e 就会在第一次失败处「断链」，失去「仅记录、不阻断」的意义。
    # !cancelled() 让官网 e2e 在前序失败后仍继续跑；但仍要求 verify 成功 —— 构建门禁没过时跑 e2e 无意义。
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        # 官网 playwright.config.ts 只声明 chromium 一个 project，无需装全部内核。
        run: npx playwright install --with-deps chromium

      - name: 运行官网 e2e
        # 该脚本内部：vite build --mode e2e --outDir dist-e2e → vite preview(4173) → playwright test → 清理进程。
        # CI 无后端服务，排除 @needs-backend 用例（首页/商品详情/结算条等依赖真实接口的用例）；
        # 本地起后端后可用 npm run test:e2e 全量跑。
        working-directory: frontend-user-v3-www
        run: npm run test:e2e -- --grep-invert @needs-backend

  console-e2e:
    name: 控制台 e2e
    # 串行链末端：等 www-e2e 结束再启动，避免与官网 e2e 抢 4173。
    needs: [verify, www-e2e]
    # 同上：前序 e2e 失败不应中断后续端；verify 未通过则跳过。
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        # 控制台 playwright.config.ts 只声明 chromium 一个 project，无需装全部内核。
        run: npx playwright install --with-deps chromium

      - name: 运行控制台 e2e
        # 该脚本内部：vite build --mode e2e --outDir dist-e2e → vite preview(4173) → playwright test → 清理进程。
        working-directory: frontend-user-v4-console
        run: npm run test:e2e
