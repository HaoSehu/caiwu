name: Frontend

# 前端门禁：lint、类型检查、三端构建。只跑 push 到 main 与 pull_request，不自动部署。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 前端门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 共享层与构建配置单元测试
        # test:shared 覆盖共享运行时/金额格式等纯逻辑，test:build-config 覆盖体积门禁
        # 自身的拦截能力（含「缺 name 必须失败」）。两者此前不在 CI 里，门禁脚本回归无人守。
        run: |
          npm run test:shared
          npm run test:build-config

      - name: Lint
        run: npm run lint:frontends

      - name: 类型检查
        run: npm run typecheck:frontends

      - name: 构建三端
        run: npm run build:frontends
