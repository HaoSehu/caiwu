name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 (Laravel)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: idc_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          # 避开 runner 自带 MySQL 占用的 3306
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 13306
      DB_DATABASE: idc_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, openssl, redis
          coverage: none
          tools: composer:v2

      - name: 生成 APP key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" >> $GITHUB_ENV

      - name: 校验 composer.json
        run: composer validate --strict --no-check-publish

      - name: 缓存 Composer 依赖
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 代码风格检查 (Pint)
        run: composer format:check

      - name: 静态分析 (PHPStan)
        run: composer analyse

      - name: 运行测试
        run: composer test

  frontend:
    name: 前端 (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint 检查
        run: npm run lint:frontends

      - name: 类型检查
        run: npm run typecheck:frontends

      # admin 的 test 是 Playwright e2e（需要浏览器与运行中的后端），不放进常规 CI
      - name: 测试（shared + www + console）
        run: |
          npm run test:shared
          npm run test --workspace chuangouyun-user-v3-www
          npm run test --workspace chuangouyun-user-v4-console

      - name: 构建
        run: npm run build:frontends

      - name: 文档检查
        run: npm run docs:check
