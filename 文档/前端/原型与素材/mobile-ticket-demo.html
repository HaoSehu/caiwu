<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>工单交流 - 手机端 Demo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand: #165DFF;
    --brand-hover: #0E4FCC;
    --brand-soft: #E8F1FF;
    --brand-border: #C9DBFF;
    --success: #12B76A;
    --success-soft: #EAFBF3;
    --warning: #F59E0B;
    --warning-soft: #FFF6E5;
    --danger: #F04438;
    --danger-soft: #FFF1F0;
    --purple: #8B5CF6;
    --bg: #F5F7FB;
    --bg-soft: #F8FAFC;
    --card: #FFFFFF;
    --border: #E5EAF3;
    --divider: #EEF2F7;
    --text-primary: #1F2937;
    --text-secondary: #5B6B82;
    --text-placeholder: #94A0B2;
    --shadow-sm: 0 2px 10px rgba(15,23,42,0.04);
    --shadow-md: 0 10px 30px rgba(15,23,42,0.06);
    --radius-card: 14px;
    --radius-input: 10px;
    --radius-tag: 999px;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #E8ECF3;
    font-family: var(--font);
    padding: 16px;
  }

  /* ── 手机壳 ── */
  .phone-frame {
    width: 375px;
    height: 812px;
    background: var(--bg);
    border-radius: 32px;
    overflow: hidden;
    box-shadow:
      0 0 0 8px #1a1a1a,
      0 0 0 10px #2d2d2d,
      0 0 0 12px #1a1a1a,
      0 20px 60px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ── 状态栏 ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 24px 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    background: #fff;
    flex-shrink: 0;
  }
  .status-bar .time { font-size: 13px; }
  .status-icons { display: flex; gap: 6px; align-items: center; }
  .status-icons svg { width: 16px; height: 16px; }

  /* ── 顶部导航 ── */
  .nav-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: #fff;
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .nav-back {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent;
    color: var(--brand);
    cursor: pointer;
    border-radius: 8px;
    font-size: 20px;
    flex-shrink: 0;
  }
  .nav-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    flex: 1;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-action {
    width: 32px; height: 32px;
    flex-shrink: 0;
  }

  /* ── 工单头部信息 ── */
  .ticket-header {
    padding: 14px 16px;
    background: #fff;
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .ticket-header-top {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .ticket-id {
    font-size: 12px;
    color: var(--text-placeholder);
    font-weight: 500;
  }
  .ticket-subject {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.4;
    margin-bottom: 10px;
  }
  .ticket-meta-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 500;
    border-radius: var(--radius-tag);
    line-height: 1.4;
  }
  .tag--warning  { color: #B45309; background: #FEF3C7; }
  .tag--danger   { color: #B91C1C; background: #FEE2E2; }
  .tag--success  { color: #047857; background: #D1FAE5; }
  .tag--info     { color: #1E40AF; background: #DBEAFE; }
  .tag--purple   { color: #6D28D9; background: #EDE9FE; }

  .ticket-service-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-tag);
  }

  /* ── 消息列表 ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bg);
    -webkit-overflow-scrolling: touch;
  }
  .chat-area::-webkit-scrollbar { width: 0; }

  /* 时间分隔 */
  .time-divider {
    text-align: center;
    font-size: 11px;
    color: var(--text-placeholder);
    padding: 4px 0;
  }

  /* 系统消息 */
  .system-msg {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    padding: 8px 14px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-tag);
    align-self: center;
    max-width: 90%;
    line-height: 1.5;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
  }
  .system-msg--closed { color: #B45309; background: #FEF3C7; border-color: #FDE68A; }

  /* 消息气泡 */
  .msg-row {
    display: flex;
    gap: 8px;
    max-width: 88%;
  }
  .msg-row--customer { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row--staff   { align-self: flex-start; }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }
  .msg-avatar--customer { background: var(--brand); }
  .msg-avatar--staff   { background: var(--purple); }

  .msg-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

  .msg-meta {
    display: flex;
    gap: 6px;
    font-size: 11px;
    color: var(--text-placeholder);
    padding: 0 4px;
  }
  .msg-row--customer .msg-meta { flex-direction: row-reverse; }

  .msg-bubble {
    padding: 10px 13px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid;
  }
  .msg-row--staff .msg-bubble {
    background: #fff;
    border-color: #dce5f2;
    border-radius: 4px 14px 14px 14px;
  }
  .msg-row--customer .msg-bubble {
    background: #eaf2ff;
    border-color: #c9dcff;
    border-radius: 14px 4px 14px 14px;
  }

  /* 图片附件 */
  .msg-images {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .msg-row--customer .msg-images { justify-content: flex-end; }

  .msg-img {
    width: 72px; height: 72px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.18s ease;
    background: var(--bg-soft);
  }
  .msg-img:active { transform: scale(0.95); }
  .msg-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 图片预览遮罩 */
  .img-preview-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .img-preview-overlay.active { display: flex; }
  .img-preview-overlay img {
    max-width: 94vw;
    max-height: 94vh;
    border-radius: 8px;
    object-fit: contain;
  }

  /* ── 底部输入区 ── */
  .composer-area {
    padding: 10px 14px 14px;
    background: #fff;
    border-top: 1px solid var(--divider);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 待发送图片预览 */
  .draft-images {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .draft-img {
    position: relative;
    width: 48px; height: 48px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .draft-img img { width: 100%; height: 100%; object-fit: cover; }
  .draft-img-remove {
    position: absolute;
    top: -1px; right: -1px;
    width: 17px; height: 17px;
    border: none;
    background: rgba(31,41,55,0.78);
    color: #fff;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0 8px 0 8px;
  }

  /* 输入条 */
  .composer-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border: 1px solid #d4dce8;
    border-radius: var(--radius-tag);
    background: #fff;
    box-shadow: 0 6px 24px rgba(15,23,42,0.06);
  }
  .btn-add-img {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #ccd6e5;
    border-radius: 50%;
    background: #fff;
    color: #637083;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 24px;
    transition: all 0.18s ease;
  }
  .btn-add-img:active { background: var(--brand-soft); border-color: var(--brand-border); color: var(--brand); }
  .composer-input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-primary);
    font-family: var(--font);
    resize: none;
    padding: 4px 0;
    max-height: 100px;
    background: transparent;
  }
  .composer-input::placeholder { color: var(--text-placeholder); }
  .btn-send {
    width: 68px; height: 40px;
    border: none;
    border-radius: var(--radius-tag);
    background: var(--brand);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.18s ease;
  }
  .btn-send:active { background: var(--brand-hover); transform: scale(0.96); }
  .btn-send:disabled {
    background: #c8d6e5;
    color: #fff;
    cursor: not-allowed;
    transform: none;
  }

  /* ── 关闭提示 ── */
  .composer-closed {
    text-align: center;
    padding: 12px;
    color: #B45309;
    font-size: 13px;
    background: #FEF3C7;
    border: 1px solid #FDE68A;
    border-radius: var(--radius-input);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .composer-closed svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ── 隐藏的文件输入 ── */
  #fileInput { display: none; }

  /* 响应式：小屏不加手机壳 */
  @media (max-width: 420px) {
    body { padding: 0; background: var(--bg); }
    .phone-frame {
      width: 100%; height: 100vh;
      border-radius: 0; box-shadow: none;
      border: none;
    }
  }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 状态栏 -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="2" height="4" rx="0.5"/><rect x="3" y="6" width="2" height="6" rx="0.5"/><rect x="6" y="4" width="2" height="8" rx="0.5"/><rect x="9" y="2" width="2" height="10" rx="0.5"/><rect x="12" y="0" width="2" height="12" rx="0.5"/></svg>
      <span style="font-size:11px">5G</span>
      <svg viewBox="0 0 25 12" fill="currentColor"><rect x="0" y="8" width="2" height="4" rx="0.5"/><rect x="4" y="6" width="2" height="6" rx="0.5"/><rect x="8" y="4" width="2" height="8" rx="0.5"/><rect x="12" y="2" width="2" height="10" rx="0.5"/><rect x="16" y="0" width="2" height="12" rx="0.5"/><rect x="20" y="3" width="3" height="9" rx="1.5"/></svg>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <button class="nav-back" onclick="alert('返回工单列表')">←</button>
    <span class="nav-title">工单交流</span>
    <div class="nav-action"></div>
  </div>

  <!-- 工单头部 -->
  <div class="ticket-header" id="ticketHeader">
    <div class="ticket-header-top">
      <span class="ticket-id">#T20240518003</span>
      <span class="tag tag--warning" id="statusTag">开启</span>
    </div>
    <div class="ticket-subject">云服务器 root 密码重置后无法 SSH 连接</div>
    <div class="ticket-meta-row">
      <span class="tag tag--danger">紧急</span>
      <span class="tag tag--purple">技术支持</span>
      <span class="ticket-service-tag">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5B6B82" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="4"/><circle cx="12" cy="12" r="3"/></svg>
        ECS-i-8b2f1a3c
      </span>
    </div>
  </div>

  <!-- 消息列表 -->
  <div class="chat-area" id="chatArea">
    <!-- 消息通过 JS 渲染 -->
  </div>

  <!-- 底部输入区 -->
  <div class="composer-area" id="composerArea">
    <div class="draft-images" id="draftImages"></div>
    <div class="composer-bar">
      <button class="btn-add-img" id="btnAddImg" onclick="document.getElementById('fileInput').click()">+</button>
      <textarea class="composer-input" id="msgInput" rows="1" placeholder="输入回复内容..."
        oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight,100)+'px';updateSendBtn()"></textarea>
      <button class="btn-send" id="btnSend" disabled onclick="sendMessage()">发送</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" multiple onchange="handleFileSelect(event)">
</div>

<!-- 图片预览 -->
<div class="img-preview-overlay" id="imgPreview" onclick="closePreview()">
  <img id="imgPreviewSrc" src="" alt="预览">
</div>

<script>
// ── 工单状态枚举 ──
const STATUS = { OPEN: 0, USER_REPLY: 1, STAFF_REPLY: 2, CLOSED: 3 };
const STATUS_LABEL = { 0: '开启', 1: '客户回复', 2: '员工回复', 3: '已关闭' };
const STATUS_TAG  = { 0: 'warning', 1: 'danger', 2: 'success', 3: 'info' };
const PRIORITY_LABEL = { 1: '低', 2: '中', 3: '高', 4: '紧急' };
const DEPT_LABEL = { sales: '销售', support: '技术支持', billing: '财务', abuse: '投诉' };

// ── 当前状态 ──
let currentStatus = STATUS.OPEN;
let draftImages = [];
let nextDraftId = 0;

// ── Mock 数据 ──
const mockMessages = [
  {
    type: 'customer',
    sender: '张先生',
    time: '2024-05-18 14:32',
    content: '你好，我在控制台重置了云服务器 ECS-i-8b2f1a3c 的 root 密码，重置显示成功，但我用新密码 SSH 连接时一直提示 "Permission denied"。我试了 3 次了，确认密码没输错。',
  },
  {
    type: 'customer',
    sender: '张先生',
    time: '2024-05-18 14:33',
    content: '报错截图如下：',
    images: [
      { src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200"><rect fill="#1e1e1e" width="300" height="200"/><text fill="#f44747" font-family="monospace" font-size="14" x="16" y="36">$ ssh root@47.96.xxx.xxx</text><text fill="#f44747" font-family="monospace" font-size="14" x="16" y="62">root@47.96.xxx.xxx:</text><text fill="#f44747" font-family="monospace" font-size="14" x="16" y="88">Permission denied,</text><text fill="#f44747" font-family="monospace" font-size="14" x="16" y="114">please try again.</text><text fill="#999" font-family="monospace" font-size="13" x="16" y="150">Connection closed.</text></svg>'), alt: 'SSH 报错截图' }
    ],
  },
  {
    type: 'system',
    content: '工单已分配给客服 <b>李工</b>，请耐心等待回复'
  },
  {
    type: 'staff',
    sender: '李工 - 技术支持',
    time: '2024-05-18 14:50',
    content: '张先生您好，我是技术支持李工。我查了下您这台 ECS 的密码重置记录，显示已成功执行，但密码同步到系统可能还需要 1-2 分钟。您方便的话可以先尝试以下操作：\n\n1. 在控制台重新执行一次"强制重置密码"\n2. 等待 2 分钟后重试 SSH 连接\n3. 如果还是不行，请尝试使用 VNC 控制台登录确认密码是否生效',
  },
  {
    type: 'customer',
    sender: '张先生',
    time: '2024-05-18 15:05',
    content: '按你说的重新强制重置了一次，等了 3 分钟再试还是不行。VNC 控制台也进不去，一直转圈加载。\n\n服务器上有很重要的业务在跑，已经中断快一个小时了，能尽快帮我解决吗？',
  },
  {
    type: 'staff',
    sender: '李工 - 技术支持',
    time: '2024-05-18 15:12',
    content: '理解，我马上联系运维团队后台直接介入排查。请您稍等 5-10 分钟，我会在工单里同步进展。',
  },
  {
    type: 'staff',
    sender: '李工 - 技术支持',
    time: '2024-05-18 15:22',
    content: '运维反馈已定位问题：这台 ECS 的 QEMU Guest Agent 在密码重置时未能正确响应，导致密码未写入系统。我们已经在后台手动修复并写入新密码。请您现在重试 SSH 连接：\n\nIP：47.96.xxx.xxx\n端口：22\n账号：root\n密码：（已通过短信发送到您注册手机号）\n\n测试连通性截图：',
    images: [
      { src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" viewBox="0 0 300 140"><rect fill="#1e1e1e" width="300" height="140"/><text fill="#4ec94e" font-family="monospace" font-size="14" x="16" y="34">$ ssh root@47.96.xxx.xxx</text><text fill="#4ec94e" font-family="monospace" font-size="14" x="16" y="58">Welcome to Ubuntu 22.04 LTS</text><text fill="#4ec94e" font-family="monospace" font-size="14" x="16" y="84">Last login: Sat May 18 15:21</text><text fill="#ccc" font-family="monospace" font-size="13" x="16" y="114">root@ecs-i-8b2f1a3c:~#</text></svg>'), alt: 'SSH 连接成功截图' }
    ],
  },
  {
    type: 'customer',
    sender: '张先生',
    time: '2024-05-18 15:28',
    content: '可以 SSH 进去了！非常感谢李工和运维团队，问题已解决 👍',
  },
  {
    type: 'system',
    content: '工单已由 <b>张先生</b> 关闭',
    closed: true,
  },
];

// ── 渲染消息 ──
function renderMessages() {
  const chatArea = document.getElementById('chatArea');
  chatArea.innerHTML = '';

  let lastDate = '';

  mockMessages.forEach((msg, idx) => {
    const msgDate = msg.time ? msg.time.slice(0, 10) : '';

    // 时间分隔
    if (msgDate && msgDate !== lastDate) {
      lastDate = msgDate;
      const divider = document.createElement('div');
      divider.className = 'time-divider';
      divider.textContent = msgDate;
      chatArea.appendChild(divider);
    }

    if (msg.type === 'system') {
      const sys = document.createElement('div');
      sys.className = 'system-msg' + (msg.closed ? ' system-msg--closed' : '');
      sys.innerHTML = msg.content;
      chatArea.appendChild(sys);
      return;
    }

    const row = document.createElement('div');
    row.className = 'msg-row msg-row--' + msg.type;

    // 头像
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar msg-avatar--' + msg.type;
    avatar.textContent = msg.type === 'customer' ? msg.sender[0] : '服';
    row.appendChild(avatar);

    // 消息体
    const body = document.createElement('div');
    body.className = 'msg-body';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = `<span>${msg.sender}</span><span>${msg.time ? msg.time.slice(11, 16) : ''}</span>`;
    body.appendChild(meta);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.content;
    body.appendChild(bubble);

    // 图片
    if (msg.images && msg.images.length > 0) {
      const imgs = document.createElement('div');
      imgs.className = 'msg-images';
      msg.images.forEach(img => {
        const wrap = document.createElement('div');
        wrap.className = 'msg-img';
        wrap.onclick = () => previewImage(img.src);
        const el = document.createElement('img');
        el.src = img.src;
        el.alt = img.alt || '附件';
        el.loading = 'lazy';
        wrap.appendChild(el);
        imgs.appendChild(wrap);
      });
      body.appendChild(imgs);
    }

    row.appendChild(body);
    chatArea.appendChild(row);
  });

  // 滚动到底部
  setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 50);
}

// ── 图片预览 ──
function previewImage(src) {
  document.getElementById('imgPreviewSrc').src = src;
  document.getElementById('imgPreview').classList.add('active');
}
function closePreview() {
  document.getElementById('imgPreview').classList.remove('active');
}

// ── 更新 UI 为已关闭状态 ──
function applyClosedState() {
  const statusTag = document.getElementById('statusTag');
  statusTag.textContent = '已关闭';
  statusTag.className = 'tag tag--info';

  // 替换底部输入区
  const composerArea = document.getElementById('composerArea');
  composerArea.innerHTML = `
    <div class="composer-closed">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
      此工单已关闭
    </div>
  `;
}

// ── 发送消息 ──
function sendMessage() {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  const images = [...draftImages];

  if (!content && images.length === 0) return;

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const timeStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const newMsg = {
    type: 'customer',
    sender: '张先生',
    time: timeStr,
    content: content || '图片',
  };

  if (images.length > 0) {
    newMsg.images = images.map(img => ({ src: img.dataUrl, alt: '附件' }));
  }

  mockMessages.push(newMsg);

  // 更新当前状态为客户回复
  currentStatus = STATUS.USER_REPLY;
  const statusTag = document.getElementById('statusTag');
  statusTag.textContent = '客户回复';
  statusTag.className = 'tag tag--danger';

  // 清空输入
  input.value = '';
  input.style.height = '';
  draftImages = [];
  renderDraftImages();
  updateSendBtn();

  // 重新渲染
  renderMessages();
}

// ── 草稿图片 ──
function handleFileSelect(e) {
  const files = e.target.files;
  if (!files.length) return;

  Array.from(files).forEach(file => {
    if (!file.type.match(/image\/(jpeg|png|webp)/)) {
      alert('仅支持 jpg、png、webp 图片');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      alert('单张图片不能超过 5MB');
      return;
    }
    if (draftImages.length >= 9) {
      alert('最多上传 9 张图片');
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      draftImages.push({ id: ++nextDraftId, dataUrl: reader.result });
      renderDraftImages();
      updateSendBtn();
    };
    reader.readAsDataURL(file);
  });

  e.target.value = '';
}

function removeDraftImage(id) {
  draftImages = draftImages.filter(img => img.id !== id);
  renderDraftImages();
  updateSendBtn();
}

function renderDraftImages() {
  const container = document.getElementById('draftImages');
  container.innerHTML = draftImages.map(img => `
    <div class="draft-img">
      <img src="${img.dataUrl}" alt="附件">
      <button class="draft-img-remove" onclick="removeDraftImage(${img.id})">×</button>
    </div>
  `).join('');
}

// ── 发送按钮状态 ──
function updateSendBtn() {
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('btnSend');
  const hasContent = input.value.trim().length > 0 || draftImages.length > 0;
  btn.disabled = !hasContent;
}

// ── 键盘事件 ──
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && document.activeElement === document.getElementById('msgInput')) {
    e.preventDefault();
    const btn = document.getElementById('btnSend');
    if (!btn.disabled) sendMessage();
  }
});

// ── 初始化 ──
renderMessages();
// 演示：把最后两条（已关闭的系统消息）去掉，让 demo 默认展示交流中的状态

// applyClosedState();
</script>
